services:
  postgres:
    image: postgres:17
    container_name: backstage-like-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: backstage_like
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d backstage_like"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: